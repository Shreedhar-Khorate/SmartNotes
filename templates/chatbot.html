<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Note Summarizer</title>
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ml.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/3062/3062634.png">
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .chat-container {
      width: 600px;
      height: 600px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      text-align: center;
      font-size: 1.3rem;
      color: #00ffff;
      font-weight: bold;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-bubble {
      padding: 10px 15px;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .user-msg {
      background: #00bfff;
      color: #0f172a;
      align-self: flex-end;
    }

    .bot-msg {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      align-self: flex-start;
    }

    .chat-input {
      display: flex;
      background: rgba(255, 255, 255, 0.08);
      padding: 10px;
    }

    .chat-input input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 1rem;
      padding: 8px;
    }

    .chat-input button {
      background: #00ffff;
      border: none;
      color: #0f172a;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .chat-input button:hover {
      background: #00bfff;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #00bfff;
      border: none;
      color: #0f172a;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <button class="back-btn" onclick="window.location.href='{{ url_for('index') }}';return false;">← Back</button>

  <div class="chat-container">
    <div class="chat-header">🧠 Smart Note Summarizer</div>
    <div class="chat-body" id="chatBody">
      <div class="chat-bubble bot-msg">
        Hello! 👋 I’m Smart Note Summarizer — your AI study companion. Ask me to summarize topics, explain notes, or quiz you!
      </div>
    </div>

    <div class="chat-input">
      <input id="userInput" type="text" placeholder="Type your message..." onkeypress="if(event.key==='Enter')sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const chatBody = document.getElementById("chatBody");
      const message = input.value.trim();
      if (!message) return;

      // Add user message
      const userBubble = document.createElement("div");
      userBubble.className = "chat-bubble user-msg";
      userBubble.textContent = message;
      chatBody.appendChild(userBubble);
      input.value = "";
      chatBody.scrollTop = chatBody.scrollHeight;

      // Add bot typing placeholder
      const botBubble = document.createElement("div");
      botBubble.className = "chat-bubble bot-msg";
      botBubble.textContent = "Typing...";
      chatBody.appendChild(botBubble);
      chatBody.scrollTop = chatBody.scrollHeight;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await res.json();
        botBubble.textContent = data.response || "Sorry, I couldn't understand.";
        chatBody.scrollTop = chatBody.scrollHeight;

      } catch (err) {
        botBubble.textContent = "⚠️ Connection error.";
      }
    }
  </script>
</body>
</html>
